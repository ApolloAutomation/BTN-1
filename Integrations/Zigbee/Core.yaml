# Apollo Automation BTN-1 Hardware Configuration for Zigbee
#
# Hardware definitions shared by the BTN-1 Zigbee variants. The Zigbee
# endpoint layout lives in BTN-1.yaml; this file provides the entities the
# endpoints connect to, plus local feedback (LEDs, buzzer) and the reset
# button behavior.
#
# Differences from the Wi-Fi Core.yaml, on purpose:
# - No wifi, api, ota, web_server, captive_portal, or version sensors.
# - No deep sleep: this firmware runs as a non-sleepy Zigbee end device.
#   The component in use has no sleepy end device support, so a sleeping
#   device would fall off the network and lose button presses. USB-C power
#   is the intended mode; on battery the always-on radio drains in days,
#   which the docs state plainly.
# - Button click, double click, triple click, and hold detection runs
#   on-device with the same timing windows as the Wi-Fi firmware, and is
#   published over Zigbee as MultistateInput action values.
# - Raw press and release state is published from the BinaryInput
#   attributes wired in BTN-1.yaml; no automation is needed here for that.
#
# Reset button (GPIO9) hold tiers:
# - Tap (under 1 second): status LED. Blue means joined to a Zigbee
#   network, yellow means not joined.
# - Hold 5 to 10 seconds, then release: Zigbee reset. Leaves the network,
#   erases Zigbee network data, reboots into pairing mode.
# - Hold 10 seconds (fires while still held): full factory reset. Erases
#   ESPHome preferences and Zigbee network data, then reboots.

substitutions:
  name: apollo-btn-1-zb
  version: "26.7.19.1-zigbee"
  device_description: Apollo Automation BTN-1 Zigbee firmware ${version}

# ============================================
# I2C Bus (MAX17048 fuel gauge)
# ============================================
i2c:
  id: i2c_bus
  sda: GPIO1
  scl: GPIO0

# ============================================
# Buzzer (LEDC + RTTTL)
# ============================================
output:
  - platform: ledc
    pin: GPIO23
    id: buzzer

rtttl:
  id: rtttl_buzzer
  output: buzzer

# ============================================
# Buttons
# ============================================
binary_sensor:
  # Reset Button (GPIO9). See the tier table in the header comment.
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    id: reset_button
    internal: true
    on_multi_click:
      # Tap: show join status on the LEDs
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - script.execute: status_check
      # 5-10 s hold, released: Zigbee reset, enter pairing mode
      - timing:
          - ON for 5s to 10s
          - OFF for at least 0.2s
        then:
          - logger.log:
              level: INFO
              format: "Zigbee reset, entering pairing mode"
          - zigbee.reset: zb
      # 10 s hold: full factory reset (ESPHome preferences + Zigbee network
      # data). zigbee.reset erases Zigbee NVRAM and reboots, so the
      # preference wipe must happen first, in the same automation.
      - timing:
          - ON for at least 10s
        then:
          - logger.log:
              level: INFO
              format: "Factory reset: erasing ESPHome preferences and Zigbee network data"
          - lambda: |-
              global_preferences->reset();
          - zigbee.reset: zb

  # Button 1 (GPIO2). Raw state flows through the BinaryInput attribute
  # wired in BTN-1.yaml. The blocks below add click semantics with the
  # same timing windows as the Wi-Fi firmware.
  - platform: gpio
    id: button_1
    name: "Button 1"
    pin:
      number: GPIO2
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_off: 10ms
    on_press:
      then:
        - zigbee.reportAttr: btn1_state
    on_release:
      then:
        - zigbee.reportAttr: btn1_state
    on_multi_click:
      - timing:
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 1
              action: 1
      # The closing quiet period matches single and triple, so a slow triple
      # click cannot fire double and triple on the same gesture.
      - timing:
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 1
              action: 2
      - timing:
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 1
              action: 3
      - timing:
          - ON for 1s to 5s
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 1
              action: 4

  # Button 2 (GPIO4)
  - platform: gpio
    id: button_2
    name: "Button 2"
    pin:
      number: GPIO4
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_off: 10ms
    on_press:
      then:
        - zigbee.reportAttr: btn2_state
    on_release:
      then:
        - zigbee.reportAttr: btn2_state
    on_multi_click:
      - timing:
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 2
              action: 1
      # The closing quiet period matches single and triple, so a slow triple
      # click cannot fire double and triple on the same gesture.
      - timing:
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 2
              action: 2
      - timing:
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 2
              action: 3
      - timing:
          - ON for 1s to 5s
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 2
              action: 4

  # Button 3 (GPIO6)
  - platform: gpio
    id: button_3
    name: "Button 3"
    pin:
      number: GPIO6
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_off: 10ms
    on_press:
      then:
        - zigbee.reportAttr: btn3_state
    on_release:
      then:
        - zigbee.reportAttr: btn3_state
    on_multi_click:
      - timing:
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 3
              action: 1
      # The closing quiet period matches single and triple, so a slow triple
      # click cannot fire double and triple on the same gesture.
      - timing:
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 3
              action: 2
      - timing:
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 3
              action: 3
      - timing:
          - ON for 1s to 5s
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 3
              action: 4

  # Button 4 (GPIO5)
  - platform: gpio
    id: button_4
    name: "Button 4"
    pin:
      number: GPIO5
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_off: 10ms
    on_press:
      then:
        - zigbee.reportAttr: btn4_state
    on_release:
      then:
        - zigbee.reportAttr: btn4_state
    on_multi_click:
      - timing:
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 4
              action: 1
      # The closing quiet period matches single and triple, so a slow triple
      # click cannot fire double and triple on the same gesture.
      - timing:
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 4
              action: 2
      - timing:
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at most 0.5s
          - ON for at most 300ms
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 4
              action: 3
      - timing:
          - ON for 1s to 5s
          - OFF for at least 0.5s
        then:
          - script.execute:
              id: send_action
              button: 4
              action: 4

# ============================================
# Battery Monitoring (MAX17048)
# ============================================
sensor:
  - platform: max17048
    id: max_17048
    update_interval: 300s
    battery_voltage:
      name: "Battery voltage"
      id: batt_v
    battery_level:
      name: "Battery level"
      id: batt_pct
      filters:
        - lambda: |-
            if (isnan(x)) return {};
            if (x > 100.0f) return 100.0f;
            if (x < 0.0f) return 0.0f;
            return x;

# ============================================
# Power rails (hardware control, always on)
# ============================================
switch:
  - platform: gpio
    pin: GPIO19
    name: "Power Latch"
    id: power_latch
    restore_mode: ALWAYS_ON
    setup_priority: 2000
    internal: true

  - platform: gpio
    pin: GPIO18
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 2000
    internal: true

# ============================================
# RGB LEDs (WS2812 on GPIO21)
# ============================================
light:
  # Full strip (internal, used by the partitions and local feedback)
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO21
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 4
    rgb_order: grb
    internal: true

  # Per-button lights, exposed over Zigbee as endpoints 5-8
  - platform: partition
    name: "BTN 1 Light"
    id: btn_1_light
    default_transition_length: 0s
    segments:
      - id: rgb_light
        from: 0
        to: 0

  - platform: partition
    name: "BTN 2 Light"
    id: btn_2_light
    default_transition_length: 0s
    segments:
      - id: rgb_light
        from: 1
        to: 1

  - platform: partition
    name: "BTN 3 Light"
    id: btn_3_light
    default_transition_length: 0s
    segments:
      - id: rgb_light
        from: 2
        to: 2

  - platform: partition
    name: "BTN 4 Light"
    id: btn_4_light
    default_transition_length: 0s
    segments:
      - id: rgb_light
        from: 3
        to: 3

# ============================================
# Local feedback scripts
# ============================================
script:
  # Green flash and a short chirp when the device joins a Zigbee network
  - id: join_feedback
    mode: restart
    then:
      - light.turn_on:
          id: rgb_light
          red: 0%
          green: 100%
          blue: 0%
          brightness: 60%
      - rtttl.play: "joined:d=16,o=6,b=140:c,e,g"
      - delay: 2s
      - light.turn_off: rgb_light

  # Join status on tap of the reset button: blue joined, yellow not joined.
  # Uses only the button 1 light so coordinator-set colors on the other
  # three lights survive; see ZIGBEE_NOTES.md on local feedback.
  - id: status_check
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(zb).is_connected();'
          then:
            - light.turn_on:
                id: btn_1_light
                red: 0%
                green: 0%
                blue: 100%
                brightness: 60%
          else:
            - light.turn_on:
                id: btn_1_light
                red: 100%
                green: 100%
                blue: 0%
                brightness: 60%
      - delay: 3s
      - light.turn_off: btn_1_light

  # Action fan-in: sets and reports the multistate attribute for one button.
  # Gated on being joined so presses before the first join cannot queue and
  # replay as phantom events at join time.
  - id: send_action
    mode: queued
    parameters:
      button: int
      action: int
    then:
      - if:
          condition:
            lambda: 'return id(zb).is_connected();'
          then:
            - if:
                condition:
                  lambda: 'return button == 1;'
                then:
                  - zigbee.setAttr:
                      id: btn1_action
                      value: !lambda 'return action;'
                  - zigbee.reportAttr: btn1_action
            - if:
                condition:
                  lambda: 'return button == 2;'
                then:
                  - zigbee.setAttr:
                      id: btn2_action
                      value: !lambda 'return action;'
                  - zigbee.reportAttr: btn2_action
            - if:
                condition:
                  lambda: 'return button == 3;'
                then:
                  - zigbee.setAttr:
                      id: btn3_action
                      value: !lambda 'return action;'
                  - zigbee.reportAttr: btn3_action
            - if:
                condition:
                  lambda: 'return button == 4;'
                then:
                  - zigbee.setAttr:
                      id: btn4_action
                      value: !lambda 'return action;'
                  - zigbee.reportAttr: btn4_action
