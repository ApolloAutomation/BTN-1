            - attribute_id: 0x400A
              type: 16BITMAP
              value: 8
    # BTN 3 Light
    - device_type: COLOR_DIMMABLE_LIGHT
      num: 7
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0x0
              type: BOOL
              value: false
              report: true
              device: btn_3_light
        - id: LEVEL_CONTROL
          attributes:
            - attribute_id: 0x0
              type: U8
              value: 255
              report: true
