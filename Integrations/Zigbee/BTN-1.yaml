            - attribute_id: 0x400A
              type: 16BITMAP
              value: 8
    # BTN 4 Light
    - device_type: COLOR_DIMMABLE_LIGHT
      num: 8
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0x0
              type: BOOL
