# Most action pins live in ApolloAutomation/Workflows (reusable workflows
# referenced @main). build-beta.yml pins its own actions; Dependabot only
# reads the default branch, so those bumps arrive once it reaches main.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci): "
    groups:
      github-actions:
        patterns:
          - "*"
